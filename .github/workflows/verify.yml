name: verify
on: [push, pull_request]
jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the two-sided suite (stdlib only)
        run: python3 verify.py
      - name: Regeneration is byte-identical
        run: |
          before=$(cat vectors/*.json MANIFEST.json | sha256sum)
          python3 tools/gen_vectors.py
          after=$(cat vectors/*.json MANIFEST.json | sha256sum)
          test "$before" = "$after"
  crypto-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Crypto profile vectors, read from crypto/MANIFEST.json (fails on an unexercised reason, a one-sided kind or an empty set)
        run: python3 crypto/verify_crypto.py
      - name: Every mutant killed by its named vector
        run: python3 crypto/verify_crypto.py --mutants
      - name: Crypto vector regeneration is byte-identical
        run: |
          before=$(cat crypto/vectors/*.json crypto/MANIFEST.json | sha256sum)
          python3 crypto/gen_crypto_vectors.py
          after=$(cat crypto/vectors/*.json crypto/MANIFEST.json | sha256sum)
          test "$before" = "$after"
  eip712-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: EIP-712 payload-signature vectors, read from crypto/EIP712_MANIFEST.json (fails on an unexercised reason, a one-sided kind or an empty set)
        run: python3 crypto/verify_eip712.py
      - name: EIP-712 mutants (each one-site broken verifier must fail its named vector)
        run: python3 crypto/verify_eip712.py --mutants
      - name: EIP-712 vector regeneration is byte-identical
        run: |
          before=$(cat crypto/eip712_vectors/*.json crypto/EIP712_MANIFEST.json | sha256sum)
          python3 crypto/gen_eip712_vectors.py
          after=$(cat crypto/eip712_vectors/*.json crypto/EIP712_MANIFEST.json | sha256sum)
          test "$before" = "$after"
  statement-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Chain-statement vectors, read from statement/MANIFEST.json (fails on an unexercised reason, a reject without an accepting twin or an empty set)
        run: python3 statement/verify_statement.py
      - name: Chain-statement mutants (each broken verifier must fail its named vector)
        run: python3 statement/verify_statement.py --mutants
      - name: Chain-statement vector regeneration is byte-identical
        run: |
          before=$(cat statement/vectors/*.json statement/MANIFEST.json | sha256sum)
          python3 statement/gen_statement_vectors.py
          after=$(cat statement/vectors/*.json statement/MANIFEST.json | sha256sum)
          test "$before" = "$after"
      - name: Second TypeScript-stack implementation (same authors) over the chain-statement corpus
        run: |
          npm i viem
          node tools/cross_check_statement.mjs
      - name: Direct engine parity on chain statements, corpus + off-corpus battery, no manifest oracle
        run: python3 tools/differential_statement.py
      - name: Chain-statement source mutants in both engines (each must fail its named vectors; identity mutants survive)
        run: python3 tools/mutate_statement.py
  cross-implementation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Second TypeScript-stack implementation (same authors) over the full corpus
        run: |
          npm i viem
          node tools/cross_check_ts.mjs
      - name: Direct engine parity — corpus + off-corpus mutation battery, no manifest oracle
        run: python3 tools/differential.py
      - name: Defined-members mutants (each one-site broken engine must fail its named vectors)
        run: python3 tools/mutate_members.py
      - name: v0.5.9 rule mutants (boundary_binding, chain_set, offer_binding, number domain)
        run: python3 tools/mutate_rules.py
  regeneration-arch:
    # Every generator must regenerate every committed vector byte-for-byte on more than one CPU. aarch64 runs on a native
    # GitHub-hosted arm64 runner (real hardware, not emulation); x86_64 on ubuntu-latest. The generators are stdlib-only and
    # read nothing but committed files, so any difference here is a portability bug in a generator, not in a verifier.
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Platform
        run: python3 -c "import platform, sys; print(platform.machine(), sys.byteorder, sys.version.split()[0])"
      - name: Regenerate every profile from an empty vectors directory and diff against the commit
        run: bash tools/regen_check.sh
  regeneration-s390x:
    # Big-endian coverage. No hosted s390x hardware exists, so this one is qemu-user emulation and is labelled as such.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: s390x
      - name: Regenerate under s390x (big-endian, emulated) and diff against the commit
        run: |
          docker run --rm --platform linux/s390x --network none -v "$PWD":/src:ro s390x/python:3.12-slim \
            sh -c 'cp -r /src /work && cd /work && python3 -c "import platform, sys; print(platform.machine(), sys.byteorder)" && sh tools/regen_check.sh'
